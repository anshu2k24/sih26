services:
  - type: web
    name: ertmac-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ertmac.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: ENVIRONMENT
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: STREAM_IN_PROCESS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://orisai.vercel.app,https://ertmac-nwis.vercel.app,https://sih26.vercel.app"
      - key: FRONTEND_URL
        value: "https://orisai.vercel.app"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_SPACE_URL
        sync: false
      - key: RAG_EMBEDDING_PROVIDER
        value: "sentence_transformers"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: alerts@ertmac-nwis.org
