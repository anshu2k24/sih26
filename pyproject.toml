[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ertmac-nwis"
version = "0.1.0"
description = "eRTMAC-NWIS: Nearby Wells Intelligence System (SIH 2026 PS26121)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=3.0,<4",
    "numpy>=2.0,<3",
    "pyarrow>=15,<26",
    "duckdb>=1.5,<2",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scipy>=1.13,<2",
    "jinja2>=3.1,<4",
    "missingno>=0.5,<1",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
